<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Factory Blueprint</title>
<style>
:root{--bg:#F4F6F2;--surface:#FFFFFF;--surface2:#FAFBF8;--ink:#16201B;--muted:#55605A;--faint:#8A938C;--line:#E4E8E2;--line2:#D2D8CE;--accent:#1B7A4B;--accent2:#2E9E63;--accentsoft:#E7F2EB;--blueprint:#2E5A8A;--gold:#A87D14;--goldsoft:#F6EED6;--shadow:0 1px 2px rgba(20,30,24,.05),0 10px 30px rgba(20,30,24,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0E1512;--surface:#151D18;--surface2:#1A241E;--ink:#E9EFE9;--muted:#A0AAA2;--faint:#6C776F;--line:#26302A;--line2:#334036;--accent:#3BB278;--accent2:#49C487;--accentsoft:#16281E;--blueprint:#6F9DD2;--gold:#D8B24C;--goldsoft:#2A2416;--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.45)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:0 18px 60px}
.hero{text-align:center;padding:34px 0 10px}
.eyebrow{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-size:clamp(26px,6vw,36px);margin:10px 0 4px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px}
.ring{margin:18px auto 4px;width:150px;height:150px;position:relative}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .n{font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.ring .o{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px;margin-top:18px}
.card h2{margin:0 0 2px;font-size:17px;font-weight:750}
.card .cap{color:var(--faint);font-size:12.5px;margin-bottom:10px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.leg{display:flex;align-items:center;gap:8px;font-size:13px}
.leg .d{width:10px;height:10px;border-radius:3px;flex:none}
.leg .v{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.focus{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.fitem{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
.fitem .tag{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;white-space:nowrap;margin-top:1px}
.fitem .w{background:var(--accentsoft);color:var(--accent)}
.fitem .s{background:var(--goldsoft);color:var(--gold)}
.fitem .t{font-weight:650;font-size:14.5px}
.prog{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.pcol{flex:none;text-align:center;min-width:72px}
.pcol .bar{height:90px;display:flex;align-items:flex-end;justify-content:center}
.pcol .fill{width:26px;border-radius:6px 6px 0 0;background:linear-gradient(var(--accent2),var(--accent))}
.pcol .pv{font-weight:700;font-size:13px;margin-top:4px;font-variant-numeric:tabular-nums}
.pcol .pt{font-size:10px;color:var(--faint);margin-top:1px}
.note{color:var(--muted);font-size:13px}
.foot{text-align:center;color:var(--faint);font-size:12px;margin-top:26px}
.foot .tag{font-family:ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;font-size:10px;color:var(--accent)}
svg{display:block;margin:0 auto;max-width:100%}
</style></head><body><div class="wrap" id="app"><div class="card" style="margin-top:40px"><p class="note">Loading…</p></div></div>
<script>
(function(){
var FN="https://fsbzdnstyvsyirlcyjiw.supabase.co/functions/v1/ff-blueprint";
var TOKEN=new URLSearchParams(location.search).get('p')||'';
var app=document.getElementById('app');
var CSHORT={'Technical/Tactical':'Technical','Goalkeeping':'Goalkeeping','Physical':'Physical','Psychological':'Mental','Social':'Social'};
var CCOL={'Technical/Tactical':'#1F8A54','Goalkeeping':'#C1712A','Physical':'#2E6FB0','Psychological':'#8A5A9E','Social':'#1E8A86'};
var ORDER=['Technical/Tactical','Goalkeeping','Physical','Psychological','Social'];
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function showError(m){app.innerHTML='<div class="card" style="margin-top:40px"><div class="eyebrow">Factory Blueprint</div><h2 style="margin-top:8px">Factory Blueprint</h2><p class="note">'+esc(m)+'</p></div>';}

if(!TOKEN){showError("This Blueprint link looks incomplete.");return;}
fetch(FN+'?p='+encodeURIComponent(TOKEN)).then(function(r){return r.json();}).then(function(j){
  if(!j.ok||!j.terms||!j.terms.length){showError(j.ok?"This player’s first Blueprint is on its way.":(j.error||"Not found."));return;}
  render(j);
}).catch(function(){showError("Couldn’t load — please check your connection and refresh.");});

function cornersOf(t){
  return ORDER.map(function(c){return {key:c,label:CSHORT[c],color:CCOL[c],value:t.corners[c]};}).filter(function(x){return x.value!=null;});
}

function render(j){
  var terms=j.terms, latest=terms[terms.length-1];
  var first=(j.player.name||'').split(' ')[0]||j.player.name;
  var band=(j.player.band||'').replace(/^B\d\s*/,'');
  var cs=cornersOf(latest);
  var html='<div class="hero"><div class="eyebrow">The Factory Blueprint</div>'+
    '<h1>'+esc(first)+'’s Development</h1>'+
    '<div class="sub">'+esc(j.player.name)+(band?' · '+esc(band):'')+' · '+esc(latest.term)+'</div>'+
    ring(latest.overall)+'</div>';

  html+='<div class="card"><h2>Where '+esc(first)+' is now</h2><div class="cap">Scored by the coaches across the four corners of the game — for '+esc(first)+'’s age.</div>'+
    radar(cs)+'<div class="legend">'+cs.map(function(c){return '<div class="leg"><span class="d" style="background:'+c.color+'"></span>'+esc(c.label)+'<span class="v">'+c.value+'</span></div>';}).join('')+'</div></div>';

  if(latest.focus&&latest.focus.length){
    html+='<div class="card"><h2>This term’s focus</h2><div class="cap">The three things '+esc(first)+' is working on with the coaches this term.</div><div class="focus">';
    latest.focus.forEach(function(f,i){var strength=(i===latest.focus.length-1&&latest.focus.length>=3);
      html+='<div class="fitem"><span class="tag '+(strength?'s':'w')+'">'+(strength?'Sharpen':'Build')+'</span><div class="t">'+esc(f)+'</div></div>';});
    html+='</div></div>';
  }

  html+='<div class="card"><h2>Progress over time</h2>';
  if(terms.length>=2){
    var max=10;
    html+='<div class="cap">'+esc(first)+'’s overall score each term.</div><div class="prog">'+terms.map(function(t){
      var h=Math.round((t.overall/max)*90);
      return '<div class="pcol"><div class="bar"><div class="fill" style="height:'+h+'px"></div></div><div class="pv">'+(t.overall!=null?t.overall:'–')+'</div><div class="pt">'+esc((t.term||'').replace(/\s*\(.*\)/,''))+'</div></div>';
    }).join('')+'</div>';
  } else {
    html+='<div class="cap">This is '+esc(first)+'’s starting point.</div><p class="note">Every term, the coaches re-score the same skills — so you’ll watch '+esc(first)+'’s progress build right here, term after term.</p>';
  }
  html+='</div>';

  html+='<div class="foot"><div class="tag">Precision · Passion · Performance</div><div style="margin-top:6px">Futbol Factory · The Factory Blueprint</div></div>';
  app.innerHTML=html;
}

function ring(v){
  if(v==null)v=0;
  var R=66,C=2*Math.PI*R,off=C*(1-v/10);
  return '<div class="ring"><svg viewBox="0 0 150 150" width="150" height="150">'+
    '<circle cx="75" cy="75" r="'+R+'" fill="none" stroke="var(--line2)" stroke-width="11"/>'+
    '<circle cx="75" cy="75" r="'+R+'" fill="none" stroke="var(--accent)" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" transform="rotate(-90 75 75)"/>'+
    '</svg><div class="lbl"><div class="n">'+v+'</div><div class="o">Overall / 10</div></div></div>';
}

function radar(cs){
  var N=cs.length; if(N<3)return '';
  var cx=180,cy=150,R=96;
  function pt(ang,rad){return [cx+rad*Math.cos(ang),cy+rad*Math.sin(ang)];}
  var ang=function(i){return -Math.PI/2+i*2*Math.PI/N;};
  var svg='<svg viewBox="0 0 360 300" width="360" height="300" aria-label="Skill radar">';
  // rings
  for(var g=2;g<=10;g+=2){
    var pts=[];for(var i=0;i<N;i++){var p=pt(ang(i),R*g/10);pts.push(p[0].toFixed(1)+','+p[1].toFixed(1));}
    svg+='<polygon points="'+pts.join(' ')+'" fill="none" stroke="var(--line)" stroke-width="1"/>';
  }
  // axes + labels
  for(var i=0;i<N;i++){
    var o=pt(ang(i),R);
    svg+='<line x1="'+cx+'" y1="'+cy+'" x2="'+o[0].toFixed(1)+'" y2="'+o[1].toFixed(1)+'" stroke="var(--line2)" stroke-width="1"/>';
    var lp=pt(ang(i),R+18),anchor=(Math.abs(lp[0]-cx)<14)?'middle':(lp[0]>cx?'start':'end');
    svg+='<text x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+3).toFixed(1)+'" text-anchor="'+anchor+'" font-size="12" font-weight="700" fill="var(--ink)">'+esc(cs[i].label)+'</text>';
    svg+='<text x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+17).toFixed(1)+'" text-anchor="'+anchor+'" font-size="11" fill="var(--muted)">'+cs[i].value+'</text>';
  }
  // value polygon
  var vp=[];for(var i=0;i<N;i++){var p=pt(ang(i),R*(cs[i].value||0)/10);vp.push(p[0].toFixed(1)+','+p[1].toFixed(1));}
  svg+='<polygon points="'+vp.join(' ')+'" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>';
  for(var i=0;i<N;i++){var p=pt(ang(i),R*(cs[i].value||0)/10);svg+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.5" fill="var(--accent)"/>';}
  svg+='</svg>';
  return svg;
}
})();
</script></body></html>
